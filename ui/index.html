<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nemu Timer</title><link rel="stylesheet" href="style.css"><script src="shared.js" defer></script><script defer src="preferences.js"></script><script src="main.js" defer></script></head><body class="settings">
<header id="bar"><strong><i data-icon="moon"></i>Nemu Timer<small id="previewTag"></small></strong><div class="spacer"></div><button id="language" class="pref" data-label="language" popovertarget="languages"><i data-icon="globe"></i></button><button id="theme" class="pref" data-label="dark"><i data-icon="moon"></i><i data-icon="sun"></i></button><button id="min" data-label="minimize" aria-label="ย่อหน้าต่าง"><i data-icon="minimize"></i></button><button id="close" data-label="close" aria-label="ปิดหน้าต่าง"><i data-icon="close"></i></button></header><div id="languages" popover aria-label="Language"><button lang="th" data-lang="th">ไทย</button><button lang="en" data-lang="en">English</button><button lang="ja" data-lang="ja">日本語</button><button lang="zh-CN" data-lang="zh-CN">简体中文</button></div>
<main><div class="hero" aria-hidden="true"><b>✧</b><img src="art/sleep.png" alt=""><em>z Z</em><b>✦</b></div>
<h1><span data-text="heading">ตั้งเวลาปิดคอม</span></h1>
<section id="setup"><div class="tabs"><button id="duration" aria-pressed="true"><i data-icon="timer"></i><span data-text="duration">ปิดในอีก</span></button><button id="clock" aria-pressed="false"><i data-icon="calendar"></i><span data-text="clock">ปิดตอน</span></button></div>
<div class="fields" id="relative"><label><input id="hours" type="number" min="0" max="8759" value="1" required><span data-text="hours">ชั่วโมง</span></label><label><input id="mins" type="number" min="0" max="59" value="30" required> <span data-text="mins">นาที</span></label></div>
<div class="fields" id="absolute" hidden><label><span data-text="time">เวลา</span> <button id="time" aria-haspopup="dialog"><span id="timeValue"></span><i data-icon="clock"></i></button></label></div>
<p class="summary"><i data-icon="clock"></i><span id="summary"></span></p><button class="primary" id="start"><i data-icon="power"></i><span data-text="start">เริ่มนับถอยหลัง</span><span class="glints" aria-hidden="true"></span></button></section>
<section hidden id="running"><p><span data-text="remaining">เวลาที่เหลือ</span></p><output id="remaining"></output><div class="actions"><button class="primary" id="extend"><span data-text="extend">เพิ่ม 10 นาที</span></button><button id="cancel"><span data-text="cancel">ยกเลิก</span></button></div></section>
<small id="notice" role="status"></small></main></body></html>
